  <text x="100" y="146" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="28" fill="#cc8800"> &gt; ~ &lt; </text>

  <line x1="22" y1="160" x2="178" y2="160" stroke="#ffb000" stroke-width="0.5" opacity="0.2"/>
  <text x="100" y="174" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9"  fill="#ffb000" opacity="0.5">[==========]</text>
