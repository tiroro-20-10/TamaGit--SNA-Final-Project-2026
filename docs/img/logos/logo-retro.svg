    <clipPath id="clip">
      <rect width="200" height="200" rx="14"/>
    </clipPath>
  </defs>

  <rect width="200" height="200" rx="14" fill="#120900"/>
  <rect width="200" height="200" fill="url(#scan)" clip-path="url(#clip)"/>
  <rect x="2" y="2" width="196" height="196" rx="12" fill="none" stroke="#ffb000" stroke-width="1" opacity="0.3"/>

  <text x="100" y="24" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#ffb000" opacity="0.5" letter-spacing="2">[SYS: OK]</text>
  <text x="100" y="36" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8" fill="#cc8800" opacity="0.28" letter-spacing="1">TamaGit v1.0</text>

  <text x="100" y="78"  text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="28" fill="#cc8800"> /\_/\ </text>
