services:
  gittama:
    build:
      context: .
      target: runtime
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace:/app
    volumes:
      - ~/.gittama:/root/.gittama
      - .:/workspace
    command: status
    # docker compose run --rm gittama scan

  webhook:
    build:
      context: .
      target: runtime
    working_dir: /workspace
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["src.webhook_server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONPATH: /workspace:/app
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITTAMA_STATE_PATH: /root/.gittama/state.json
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ~/.gittama:/root/.gittama
      - .:/workspace
