[project]
name = "tamagit"
version = "0.7.0"
description = "Terminal Team Tamagotchi for GitHub"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "textual>=0.80.0",
]

[project.scripts]
tamagit = "src.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"