[project]
name        = "tamagit"
version     = "0.3.0"
description = "Terminal Team Tamagotchi for GitHub — keep your repo healthy or your pet dies"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
    "textual>=0.80.0",
    "pytest>=8.0",       # needed for 'tamagit test' command
]

[project.scripts]
tamagit = "src.main:main"

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
